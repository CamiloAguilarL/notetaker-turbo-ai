[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1,<4",
    "django>=6.0.7,<6.1",
    "django-cors-headers>=4.9,<5",
    "djangorestframework>=3.17.1,<3.18",
    "psycopg[binary]>=3.3,<4",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-django>=4.11,<5",
    "ruff>=0.15,<0.16",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers --strict-config --cov=. --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
omit = [
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
    "*/migrations/*",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["DJ001"]
